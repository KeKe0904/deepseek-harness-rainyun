# DeepSeek Harness (dsh) — local development compose.
#
# Usage:
#   docker compose up -d --build
#   open http://localhost:3080   (first-time setup: Settings -> Models)
#
# All user data persists in the named volume dsh-data (mounted at /data,
# which is DSH_HOME inside the container).

services:
  dsh:
    build:
      context: .
      dockerfile: Dockerfile
    image: deepseek-harness:0.1.0-rc.6
    container_name: dsh
    restart: unless-stopped
    ports:
      - "3080:3080"
    volumes:
      - dsh-data:/data
      # Optional: give the agent a workspace it can read/write.
      # - ./workspace:/workspace
    environment:
      - DSH_HOME=/data
      - PORT=3080
      - DSH_TELEMETRY_DISABLED=1
      # Space-separated host[:port] authorities the /api trust fence accepts.
      # Local access via http://localhost:3080 is already trusted (loopback);
      # add your public domain/IP here for remote access, e.g.:
      # - DSH_TRUSTED_HOSTS=myapp.example.com 192.0.2.10:3080
      - DSH_TRUSTED_HOSTS=localhost
      # Optional: provide the model API key via env instead of the web UI
      # (DeepSeek provider reads DEEPSEEK_API_KEY).
      # - DEEPSEEK_API_KEY=sk-...

volumes:
  dsh-data:
