# DeepSeek Harness (dsh) — local development compose.
#
# Usage:
#   docker compose up -d --build
#   open http://localhost:3080   (login with DSH_AUTH_PASSWORD below)
#
# All user data persists in the named volume dsh-data (mounted at /data,
# which is DSH_HOME inside the container).

services:
  dsh:
    build:
      context: .
      dockerfile: Dockerfile
    image: deepseek-harness:0.1.0-rc.6
    container_name: dsh
    restart: unless-stopped
    ports:
      - "3080:3080"
    volumes:
      - dsh-data:/data
      # Optional: give the agent a workspace it can read/write.
      # - ./workspace:/workspace
    environment:
      - DSH_HOME=/data
      - PORT=3080
      - DSH_TELEMETRY_DISABLED=1
      # 登录密码（推荐用环境变量托管，卷重置也不丢失）
      - DSH_AUTH_PASSWORD=ChangeMe123
      # 可选：模型密钥（也可在 Web UI 配置）
      # - DEEPSEEK_API_KEY=sk-...
      # 可选：关闭密码登录（回到无鉴权模式）
      # - DSH_AUTH=0

volumes:
  dsh-data:
